# The Collector's configuration (SPEC 3 and SPEC 0b rule 5): OTLP in; k8sattributes (pod association by connection IP;
# deployment, node, and the container's image digest, so the CLI's trace.image_digest_missing does not fire and an A/B record
# names each arm's digest); batch 1 s; file exporter: OTLP/JSON lines into the edge1 hostPath, rotated every 64 MB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: maze-obs
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tag
            - container.image.repo_digests
      batch:
        send_batch_size: 8192
        timeout: 1s
    exporters:
      file:
        path: /data/spans.jsonl
        flush_interval: 1s
        rotation:
          max_megabytes: 64
          max_days: 1
          max_backups: 2000
          localtime: false
    service:
      telemetry:
        logs:
          level: warn
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [file]
